[package]
name = "Jasper"
version = "0.1.0"
edition = "2024"

[dependencies]
poise = "0.6.1"
serenity = { version = "0.12.5", features = ["voice", "gateway", "rustls_backend", "cache"] }
songbird = { version = "0.5.0", features = ["builtin-queue", "driver", "gateway"] }
tokio = { version = "1.48.0", features = ["full"] }
reqwest = { version = "0.12.26", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
dotenvy = "0.15.7"
symphonia = { version = "0.5.5", features = ["aac", "mp3", "isomp4", "alac"] }
url = "2.5.7"
thiserror = "2.0.17"
dashmap = "7.0.0-rc2"
strsim = "0.11.1"
rand = "0.9.2"